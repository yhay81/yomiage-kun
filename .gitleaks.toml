[extend]
useDefault = true

# Compatible with the action-provided gitleaks 8.24.3.
[allowlist]
description = "Generated local build output"
paths = ['''(^|[\\/])target[\\/]''']

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Public libcrux dependency-name pair in Cargo.lock only"
condition = "AND"
paths = ['''(^|[\\/])Cargo\.lock$''']
regexTarget = "match"
regexes = ['''^libcrux-secrets",\r?\n[ \t]*"libcrux-sha[23]"$''']
