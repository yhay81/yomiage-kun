name: Security

on:
  pull_request:
  schedule:
    - cron: "26 13 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Rust dependencies and licenses
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the audit tool
        working-directory: ${{ runner.temp }}
        run: |
          archive=cargo-deny-0.20.2-x86_64-unknown-linux-musl
          curl --fail --location --silent --show-error -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$archive.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tar.gz" | sha256sum --check
          tar -xzf cargo-deny.tar.gz --strip-components=1 "$archive/cargo-deny"
      - name: Audit the locked dependency graph
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          "$RUNNER_TEMP/cargo-deny" --all-features --locked check advisories licenses sources

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    timeout-minutes: 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    name: CodeQL
    timeout-minutes: 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
