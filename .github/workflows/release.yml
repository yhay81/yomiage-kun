name: Release desktop apps

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: macOS Appleシリコン
            platform: macos-latest
            args: --bundles dmg --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --bundles dmg --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build bundles and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: 読み上げくん v__VERSION__
          releaseBody: |
            お使いのパソコンに合うインストーラをダウンロードしてください。

            - Windows: `読み上げくん_*_x64-setup.exe`
            - Appleシリコン搭載Mac: `読み上げくん_*_aarch64.dmg`
            - Intel搭載Mac: `読み上げくん_*_x64.dmg`

            変更内容は CHANGELOG を確認してください。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
