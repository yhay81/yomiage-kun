version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      website:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
