[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/yomiage-core",
    "crates/yomiage-discord",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Yusuke Hayashi"]
license = "MIT"
repository = "https://github.com/yhay81/yomiage-kun"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
bytes = "1.10.1"
dashmap = "6.1.0"
directories = "6.0.0"
keyring = { version = "4.1.5", default-features = false, features = [
    "apple-native-keyring-store",
    "v1",
    "windows-native-keyring-store",
] }
moka = { version = "0.12.15", features = ["future"] }
regex = "1.11.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serenity = { version = "0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "http",
    "model",
    "rustls_backend",
] }
sha2 = "0.11.0"
songbird = { version = "0.6.0", features = ["builtin-queue", "serenity"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
