[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/yomiage-core",
    "crates/yomiage-discord",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
authors = ["Yusuke Hayashi"]
license = "MIT"
repository = "https://github.com/yhay81/yomiage-kun"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
bytes = "1.12.1"
dashmap = "6.2.1"
directories = "6.0.0"
hex = "0.4.3"
keyring = { version = "4.1.5", default-features = false, features = [
    "apple-native-keyring-store",
    "v1",
    "windows-native-keyring-store",
] }
moka = { version = "0.12.15", features = ["future"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = { version = "0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "http",
    "model",
    "native_tls_backend",
] }
sha2 = "0.11.0"
songbird = { version = "0.6.0", default-features = false, features = [
    "builtin-queue",
    "driver",
    "gateway",
    "native",
    "serenity",
    "tungstenite",
] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
